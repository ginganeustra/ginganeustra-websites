name: Publish to Neocities

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: neocities-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Upload magazines, permanent articles, verification files and sitemaps
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          upload_args=()
          while IFS= read -r -d '' file; do
            upload_args+=(-F "${file}=@${file}")
          done < <(find Brazil Argentina Canada articles -type f \
            \( -name '*.html' -o -name '*.xml' \) -print0 | sort -z)

          for file in sitemap.xml news-sitemap.xml robots.txt google*.html; do
            if [[ -f "$file" ]]; then
              upload_args+=(-F "${file}=@${file}")
            fi
          done

          if (( ${#upload_args[@]} == 0 )); then
            echo "No publication files found." >&2
            exit 1
          fi

          curl --fail-with-body --show-error \
            -H "Authorization: Bearer $NEOCITIES_API_KEY" \
            "${upload_args[@]}" \
            https://neocities.org/api/upload

      - name: Report Neocities deployment result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_RESULT: ${{ job.status }}
          STATUS_API_URL: ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_RESULT" == "success" ]]; then
            state="success"
            description="Magazines, verification files and article pages published to Neocities"
          else
            state="failure"
            description="Neocities publication failed; inspect the workflow run"
          fi

          payload="$(jq -nc \
            --arg state "$state" \
            --arg description "$description" \
            --arg url "$RUN_URL" \
            '{state: $state, context: "neocities/deployment", description: $description, target_url: $url}')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data "$payload" \
            "$STATUS_API_URL"
