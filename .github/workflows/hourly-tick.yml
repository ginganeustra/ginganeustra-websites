name: Refresh Canada at War THE TICK

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hourly-tick.yml'
      - 'scripts/update_canada_tick.py'
      - 'scripts/update_canada_trade_tick.py'

permissions:
  contents: write

concurrency:
  group: canada-at-war-hourly-tick
  cancel-in-progress: true

jobs:
  refresh-tick:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and rebuild trade-war-only THE TICK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_canada_trade_tick.py
          python3 - <<'PY'
          from pathlib import Path
          from html import unescape
          import re

          page = Path('Canada/index.html')
          text = page.read_text(encoding='utf-8')

          if '<span class="tick-label">THE TICK</span>' not in text:
              raise SystemExit('Reader-facing THE TICK label is not clean')
          if re.search(r'<span class="tick-label">[^<]*CHECKED[^<]*</span>', text, re.I):
              raise SystemExit('Reader-facing THE TICK label must not contain a refresh time')

          match = re.search(r'<!-- HOURLY_TICK_AUTO_BEGIN -->(.*?)<!-- HOURLY_TICK_AUTO_END -->', text, re.S)
          if not match:
              raise SystemExit('No protected hourly ticker block')
          labels = re.findall(r'<a\b[^>]*>(.*?)</a>', match.group(1), re.S)
          if not labels:
              raise SystemExit('Trade-war ticker produced no headlines')
          allowed = ('TRADE WAR · ', 'AUTO TARIFF · ', 'EUROPE TRADE · ', 'CHINA TRADE · ', 'METALS TARIFF · ')
          for raw in labels:
              plain = re.sub(r'<[^>]+>', ' ', unescape(raw))
              plain = re.sub(r'\s+', ' ', plain).strip()
              if not plain.startswith(allowed):
                  raise SystemExit(f'Non-trade-war ticker label blocked: {plain}')

          text, speed_count = re.subn(
              r'animation:ticker\s+\d+(?:\.\d+)?s\s+linear\s+infinite',
              'animation:ticker 88s linear infinite',
              text,
              count=1,
          )
          if speed_count != 1:
              raise SystemExit('Could not set THE TICK scroll speed')
          page.write_text(text, encoding='utf-8')
          PY

      - name: Commit the refreshed ticker to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Canada/index.html; then
            echo 'No ticker change to commit.'
            exit 0
          fi
          git config user.name 'canada-at-war-ticker[bot]'
          git config user.email 'canada-at-war-ticker[bot]@users.noreply.github.com'
          git add Canada/index.html
          git commit -m 'Hourly trade-war THE TICK refresh [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload the refreshed Canada homepage only
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEOCITIES_API_KEY:-}" ]] || { echo 'Missing NEOCITIES_API_KEY' >&2; exit 1; }
          curl --fail-with-body --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $NEOCITIES_API_KEY" \
            -F 'Canada/index.html=@Canada/index.html' \
            https://neocities.org/api/upload

      - name: Verify the hourly ticker is live
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o "$tmp" -w '%{http_code}' "https://brazilginga.neocities.org/Canada/?tick_run=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            if [[ "$code" == '200' ]] \
              && grep -Fq 'HOURLY_TICK_AUTO_BEGIN' "$tmp" \
              && grep -Fq '<span class="tick-label">THE TICK</span>' "$tmp" \
              && ! grep -Eq '<span class="tick-label">[^<]*CHECKED' "$tmp" \
              && grep -Fq 'animation:ticker 88s linear infinite' "$tmp" \
              && grep -Fq 'tradingview-widget-container' "$tmp"; then
              ok=1
              break
            fi
            sleep 5
          done
          rm -f "$tmp"
          (( ok == 1 )) || { echo 'Hourly THE TICK upload did not verify on Neocities' >&2; exit 1; }
          echo 'Hourly trade-war THE TICK is live and verified.'
