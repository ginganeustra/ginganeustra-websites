name: Refresh Canada at War THE TICK

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hourly-tick.yml'
      - 'scripts/update_canada_tick.py'
      - 'scripts/normalize_canada_ticker_speed.py'

permissions:
  contents: write

concurrency:
  group: canada-at-war-hourly-tick
  cancel-in-progress: true

jobs:
  refresh-tick:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and rebuild THE TICK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_canada_tick.py
          python3 scripts/normalize_canada_ticker_speed.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path('Canada/index.html')
          text = page.read_text(encoding='utf-8')

          text, label_count = re.subn(
              r'<span class="tick-label">THE TICK(?: · CHECKED [^<]+)?</span>',
              '<span class="tick-label">THE TICK</span>',
              text,
              count=1,
          )
          if label_count != 1:
              raise SystemExit('Could not normalize THE TICK label')

          match = re.search(r'<!-- HOURLY_TICK_AUTO_BEGIN -->(.*?)<!-- HOURLY_TICK_AUTO_END -->', text, re.S)
          if not match or '<a ' not in match.group(1):
              raise SystemExit('Hourly ticker produced no headlines')
          if 'id="ticker-speed-controller"' not in text or 'var pxPerSecond=125' not in text:
              raise SystemExit('Constant-speed controller missing from THE TICK')

          page.write_text(text, encoding='utf-8')
          PY

      - name: Commit the refreshed ticker to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Canada/index.html; then
            echo 'No ticker change to commit.'
            exit 0
          fi
          git config user.name 'canada-at-war-ticker[bot]'
          git config user.email 'canada-at-war-ticker[bot]@users.noreply.github.com'
          git add Canada/index.html
          git commit -m 'Hourly Canada-at-War THE TICK refresh [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload the refreshed Canada homepage only
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEOCITIES_API_KEY:-}" ]] || { echo 'Missing NEOCITIES_API_KEY' >&2; exit 1; }
          curl --fail-with-body --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $NEOCITIES_API_KEY" \
            -F 'Canada/index.html=@Canada/index.html' \
            https://neocities.org/api/upload

      - name: Verify the hourly ticker is live
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o "$tmp" -w '%{http_code}' "https://brazilginga.neocities.org/Canada/?tick_run=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            if [[ "$code" == '200' ]] \
              && grep -Fq 'HOURLY_TICK_AUTO_BEGIN' "$tmp" \
              && grep -Fq '<span class="tick-label">THE TICK</span>' "$tmp" \
              && ! grep -Eq '<span class="tick-label">[^<]*CHECKED' "$tmp" \
              && grep -Fq 'id="ticker-speed-controller"' "$tmp" \
              && grep -Fq 'var pxPerSecond=125' "$tmp" \
              && grep -Fq 'tradingview-widget-container' "$tmp"; then
              ok=1
              break
            fi
            sleep 5
          done
          rm -f "$tmp"
          (( ok == 1 )) || { echo 'Hourly THE TICK upload did not verify on Neocities' >&2; exit 1; }
          echo 'Hourly THE TICK is live and verified at one measured visual speed.'
