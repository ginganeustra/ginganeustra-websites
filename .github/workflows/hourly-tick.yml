name: Refresh Canada at War THE TICK

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hourly-tick.yml'
      - 'scripts/update_canada_tick.py'
      - 'scripts/update_canada_trade_tick.py'

permissions:
  contents: write

concurrency:
  group: canada-at-war-hourly-tick
  cancel-in-progress: true

jobs:
  refresh-tick:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and rebuild THE TICK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_canada_tick.py

      - name: Commit the checked ticker to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Canada/index.html; then
            echo 'No ticker change to commit.'
            exit 0
          fi
          git config user.name 'canada-at-war-ticker[bot]'
          git config user.email 'canada-at-war-ticker[bot]@users.noreply.github.com'
          git add Canada/index.html
          git commit -m 'Hourly Canada-at-War THE TICK refresh [skip ci]'
          # Other publication work can land while this hourly job is fetching feeds.
          # Rebase the one-file ticker commit instead of failing on a non-fast-forward.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload the refreshed Canada homepage only
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEOCITIES_API_KEY:-}" ]] || { echo 'Missing NEOCITIES_API_KEY' >&2; exit 1; }
          curl --fail-with-body --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $NEOCITIES_API_KEY" \
            -F 'Canada/index.html=@Canada/index.html' \
            https://neocities.org/api/upload

      - name: Verify the hourly ticker is live
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o "$tmp" -w '%{http_code}' "https://brazilginga.neocities.org/Canada/?tick_run=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            if [[ "$code" == '200' ]] \
              && grep -Fq 'HOURLY_TICK_AUTO_BEGIN' "$tmp" \
              && grep -Fq '<span class="tick-label">THE TICK</span>' "$tmp" \
              && grep -Fq 'tradingview-widget-container' "$tmp"; then
              ok=1
              break
            fi
            sleep 5
          done
          rm -f "$tmp"
          (( ok == 1 )) || { echo 'Hourly THE TICK upload did not verify on Neocities' >&2; exit 1; }
          echo 'Hourly THE TICK is live and verified.'
