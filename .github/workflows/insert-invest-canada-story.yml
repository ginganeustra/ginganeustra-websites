name: Insert Invest in Canada story
on:
  push:
    paths:
      - '.github/workflows/insert-invest-canada-story.yml'
permissions:
  contents: write
jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Insert story fourth and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Canada/index.html')
          s=p.read_text(encoding='utf-8')
          card='''<article class="story"><div class="k" style="color:#b51f2a">Economic sovereignty · Investment · Diversification</div><h2>Carney puts Barton and Grewal on the hunt for $1 trillion.</h2><p>Ottawa has put former McKinsey global managing partner and former ambassador to China Dominic Barton in the chair at Invest in Canada, with infrastructure investor Gurinder Grewal as CEO. Their assignment is bigger than attracting money: help Canada build the projects and trading options needed to become less dependent on any single partner.</p><a class="read" href="dominic-barton-gurinder-grewal-invest-in-canada-august-31-2026.html">Read the report →</a><p class="meta" style="color:#666">Published Aug. 31, 2026 · 5:15 p.m. ET</p></article>\n'''
          marker='<article class="story"><div class="k" style="color:#b51f2a">Trade war · Small business · Export shock</div>'
          if 'dominic-barton-gurinder-grewal-invest-in-canada-august-31-2026.html' not in s:
              if marker not in s: raise SystemExit('Fourth-position insertion marker not found')
              s=s.replace(marker,card+marker,1)
          s=s.replace('UPDATED · AUGUST 31, 2026 · 5:05 P.M. ET','UPDATED · AUGUST 31, 2026 · 5:15 P.M. ET',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Canada/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Place Invest in Canada story fourth on homepage'
          git push origin HEAD:main
