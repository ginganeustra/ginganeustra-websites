name: Canada Sept. 5 Lady Justice image fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/canada-sept5-lady-justice-fix.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for older normal Neocities deploys
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&per_page=30"
          for attempt in $(seq 1 120); do
            json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
            active="$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' <<<"$json")"
            echo "active normal deploys: $active"
            [[ "$active" == 0 ]] && break
            sleep 5
          done
          json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
          [[ "$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' <<<"$json")" == 0 ]]

      - name: Refresh from current main and validate Canada structure
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          required=(
            'CANADA_AT_WAR_MASTHEAD_LOCK'
            'THE TICK'
            'tradingview-widget-container'
            'canada-at-war-goose-eagle-v3.jpg'
            'petition-paint-mix'
            'How Lying Works'
            'id="must-read-library"'
          )
          for marker in "${required[@]}"; do
            grep -Fq "$marker" Canada/index.html || { echo "Missing protected marker: $marker" >&2; exit 1; }
          done
          grep -Fq 'assets/lady-justice-canada-antitrust-sept4-2026.jpg' Canada/index.html
          grep -Fq 'assets/lady-justice-canada-antitrust-sept4-2026.jpg' Canada/doj-canada-pause-misunderstanding-trump-fed-september-4-2026.html
          for n in 01 02 03 04 05 06 07 08 09; do
            test -s ".tmp/lady-q15.part${n}.b64"
          done

      - name: Rebuild and verify replacement Lady Justice image
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/lady-q15.part{01,02,03,04,05,06,07,08,09}.b64 | base64 -d > Canada/assets/lady-justice-canada-antitrust-sept4-2026.jpg
          test "$(wc -c < Canada/assets/lady-justice-canada-antitrust-sept4-2026.jpg)" -eq 16790
          echo '07867170ecaa554c2605197a2c9d206598cd25a9fbc5777d90f2255480fedf07  Canada/assets/lady-justice-canada-antitrust-sept4-2026.jpg' | sha256sum -c -
          file Canada/assets/lady-justice-canada-antitrust-sept4-2026.jpg | grep -qi 'JPEG image data'
          rm -f .tmp/lady-q15.part{01,02,03,04,05,06,07,08,09}.b64

      - name: Commit exact replacement to current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'canada-at-war-image-fix[bot]'
          git config user.email 'canada-at-war-image-fix[bot]@users.noreply.github.com'
          git add Canada/assets/lady-justice-canada-antitrust-sept4-2026.jpg .tmp
          git commit -m 'Canada: replace pixelated Lady Justice art'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for all normal deploys to settle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&per_page=30"
          for attempt in $(seq 1 120); do
            json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
            active="$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' <<<"$json")"
            echo "active normal deploys: $active"
            [[ "$active" == 0 ]] && break
            sleep 5
          done
          json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
          [[ "$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' <<<"$json")" == 0 ]]

      - name: Direct upload exact replacement image
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEOCITIES_API_KEY:-}" ]]
          curl --fail-with-body --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $NEOCITIES_API_KEY" \
            -F 'Canada/assets/lady-justice-canada-antitrust-sept4-2026.jpg=@Canada/assets/lady-justice-canada-antitrust-sept4-2026.jpg' \
            https://neocities.org/api/upload

      - name: Final public verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short="${FINAL_SHA::8}"
          check_page() {
            local url="$1" marker="$2" tmp code ok=0
            tmp="$(mktemp)"
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -L -sS -o "$tmp" -w '%{http_code}' "${url}?v=${short}&verify=${attempt}" || true)"
              if [[ "$code" == 200 ]] && grep -Fq "$marker" "$tmp"; then ok=1; break; fi
              sleep 3
            done
            echo "$url HTTP marker check=$ok"
            rm -f "$tmp"
            [[ "$ok" == 1 ]]
          }
          check_page 'https://brazilginga.neocities.org/Canada/' 'DOJ CALLS ‘PAUSE ON CANADA’ A MISUNDERSTANDING'
          check_page 'https://brazilginga.neocities.org/Canada/doj-canada-pause-misunderstanding-trump-fed-september-4-2026.html' 'lady-justice-canada-antitrust-sept4-2026.jpg'
          tmp="$(mktemp)"
          code=0
          ok=0
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o "$tmp" -w '%{http_code}' "https://brazilginga.neocities.org/Canada/assets/lady-justice-canada-antitrust-sept4-2026.jpg?v=${short}&verify=${attempt}" || true)"
            hash="$(sha256sum "$tmp" | awk '{print $1}')"
            bytes="$(wc -c < "$tmp")"
            if [[ "$code" == 200 && "$hash" == '07867170ecaa554c2605197a2c9d206598cd25a9fbc5777d90f2255480fedf07' && "$bytes" == 16790 ]]; then ok=1; break; fi
            sleep 3
          done
          echo "public image HTTP=$code bytes=$bytes sha256=$hash"
          rm -f "$tmp"
          [[ "$ok" == 1 ]]
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&per_page=30"
          json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
          [[ "$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' <<<"$json")" == 0 ]]
          echo "FINAL VERIFIED SHA=${FINAL_SHA}"

# Triggered after verified staging parts were added.
