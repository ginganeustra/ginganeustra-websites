name: Patch Marx homepage link

on:
  push:
    paths:
      - '.github/workflows/patch-marx-homepage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Marx spine to Canada homepage
        shell: python
        run: |
          from pathlib import Path
          p = Path('Canada/index.html')
          s = p.read_text(encoding='utf-8')
          old_css = '.book.buddha{width:96%;background:#5a4a27;transform:translateX(-4px)}footer{'
          new_css = '.book.buddha{width:96%;background:#5a4a27;transform:translateX(-4px)}.book.marx{width:86%;background:#7b2b2b;transform:translateX(4px)}footer{'
          old_html = '<a class="book buddha" href="donald-trump-buddha-how-lying-works.html"><span>THE BUDDHA</span><small>Power, craving and harm</small></a></div>'
          new_html = '<a class="book buddha" href="donald-trump-buddha-how-lying-works.html"><span>THE BUDDHA</span><small>Power, craving and harm</small></a><a class="book marx" href="karl-marx-how-lying-works.html"><span>KARL MARX</span><small>Capital, ideology and power</small></a></div>'
          if 'karl-marx-how-lying-works.html' not in s:
              if old_css not in s or old_html not in s:
                  raise SystemExit('Expected homepage library markers not found')
              s = s.replace(old_css, new_css, 1).replace(old_html, new_html, 1)
              p.write_text(s, encoding='utf-8')
          wf = Path('.github/workflows/patch-marx-homepage.yml')
          if wf.exists():
              wf.unlink()
      - name: Commit homepage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Canada/index.html .github/workflows/patch-marx-homepage.yml
          git commit -m "Add Karl Marx to Canada homepage library"
          git push
