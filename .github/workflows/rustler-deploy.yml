name: Publish The Rustler to Neocities

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Rustler/**'
      - '.rustler-upload/**'
      - '.github/scripts/fetch_rustler_visuals.py'
      - '.github/workflows/rustler-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild masthead asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Rustler/assets
          {
            cat .rustler-upload/masthead-01.b64
            cat .rustler-upload/masthead-02.b64
            cat .rustler-upload/masthead-03.b64
            head -c 16000 .rustler-upload/masthead-04.b64
            head -c 1620 .rustler-upload/masthead-05.b64
          } | base64 -d > Rustler/assets/rustler-masthead.webp
          test -s Rustler/assets/rustler-masthead.webp
      - name: Fetch official Rustler visuals
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fetch_rustler_visuals.py
          find Rustler/assets -type f -maxdepth 1 -print -exec ls -lh {} \;
      - name: Validate edition
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Council puts brakes on another full Notre-Dame shutdown' Rustler/index.html
          grep -Fq 'In the TWP' Rustler/index.html
          grep -Fq 'Light rain' Rustler/index.html
          grep -Fq 'photo-grid' Rustler/index.html
          grep -Fq 'township-logo-v2.png' Rustler/index.html
          grep -Fq 'mayor-tarnowski-v2.jpg' Rustler/index.html
          grep -Fq 'Keeping one lane open' Rustler/notre-dame-road-closure-council-answers-september-2026.html
          grep -Fq 'I think it’s prudent' Rustler/recreation-complex-70-million-debt-financing-september-2026.html
          test -s Rustler/assets/notre-dame.jpg
          test -s Rustler/assets/rec-complex.jpg
          test -s Rustler/assets/main-street.jpg
          test -s Rustler/assets/mayor-tarnowski-v2.jpg
          test -s Rustler/assets/township-logo-v2.png
          test -s Rustler/assets/ucpr.jpg
          test -s Rustler/assets/eohu.jpg
          file Rustler/assets/mayor-tarnowski-v2.jpg Rustler/assets/township-logo-v2.png Rustler/assets/ucpr.jpg Rustler/assets/eohu.jpg
          test -s Rustler/sitemap.xml
      - name: Upload Rustler site
        env:
          NEOCITIES_RUSTLER_API_KEY: ${{ secrets.NEOCITIES_RUSTLER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEOCITIES_RUSTLER_API_KEY:-}" ]] || { echo 'Missing NEOCITIES_RUSTLER_API_KEY secret' >&2; exit 1; }
          while IFS= read -r -d '' file; do
            rel="${file#Rustler/}"
            echo "Uploading $rel"
            curl --fail-with-body --show-error --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $NEOCITIES_RUSTLER_API_KEY" \
              -F "${rel}=@${file}" https://neocities.org/api/upload
          done < <(find Rustler -type f -print0 | sort -z)
      - name: Verify live edition
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          rec="$(mktemp)"
          mayor="$(mktemp)"
          logo="$(mktemp)"
          ucpr="$(mktemp)"
          eohu="$(mktemp)"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o "$tmp" -w '%{http_code}' "https://therustler.neocities.org/?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            reccode="$(curl -L -sS -o "$rec" -w '%{http_code}' "https://therustler.neocities.org/assets/rec-complex.jpg?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            mayorcode="$(curl -L -sS -o "$mayor" -w '%{http_code}' "https://therustler.neocities.org/assets/mayor-tarnowski-v2.jpg?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            logocode="$(curl -L -sS -o "$logo" -w '%{http_code}' "https://therustler.neocities.org/assets/township-logo-v2.png?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            ucprcode="$(curl -L -sS -o "$ucpr" -w '%{http_code}' "https://therustler.neocities.org/assets/ucpr.jpg?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            eohucode="$(curl -L -sS -o "$eohu" -w '%{http_code}' "https://therustler.neocities.org/assets/eohu.jpg?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            if [[ "$code" == "200" ]] && [[ "$reccode" == "200" ]] && [[ "$mayorcode" == "200" ]] && [[ "$logocode" == "200" ]] && [[ "$ucprcode" == "200" ]] && [[ "$eohucode" == "200" ]] && grep -Fq 'Keeping one lane open' "$tmp" && grep -Fq 'photo-grid' "$tmp" && grep -Fq 'site.css?v=4' "$tmp" && [[ -s "$rec" ]] && [[ -s "$mayor" ]] && [[ -s "$logo" ]] && [[ -s "$ucpr" ]] && [[ -s "$eohu" ]]; then
              echo 'Verified The Rustler mobile-image fix live'
              file "$rec" "$mayor" "$logo" "$ucpr" "$eohu" || true
              rm -f "$tmp" "$rec" "$mayor" "$logo" "$ucpr" "$eohu"
              exit 0
            fi
            sleep 4
          done
          echo 'Homepage verification body:'
          cat "$tmp" || true
          rm -f "$tmp" "$rec" "$mayor" "$logo" "$ucpr" "$eohu"
          exit 1
