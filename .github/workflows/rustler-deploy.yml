name: Publish The Rustler to Neocities

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Rustler/**'
      - '.rustler-upload/**'
      - '.github/scripts/fetch_rustler_visuals.py'
      - '.github/scripts/fix_rustler_attributions.py'
      - '.github/workflows/rustler-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild masthead asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Rustler/assets
          {
            cat .rustler-upload/masthead-01.b64
            cat .rustler-upload/masthead-02.b64
            cat .rustler-upload/masthead-03.b64
            head -c 16000 .rustler-upload/masthead-04.b64
            head -c 1620 .rustler-upload/masthead-05.b64
          } | base64 -d > Rustler/assets/rustler-masthead.webp
          test -s Rustler/assets/rustler-masthead.webp
      - name: Fetch official Rustler visuals
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fetch_rustler_visuals.py
          find Rustler/assets -type f -maxdepth 1 -print -exec ls -lh {} \;
      - name: Apply verified quote attributions and mobile fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_rustler_attributions.py
      - name: Validate edition
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Council puts brakes on another full Notre-Dame shutdown' Rustler/index.html
          grep -Fq 'In the TWP' Rustler/index.html
          grep -Fq 'reader-actions' Rustler/index.html
          ! grep -Fq 'weather-strip' Rustler/index.html
          grep -Fq 'High / Low' Rustler/index.html
          grep -Fq 'Sunday edition · September 6, 2026' Rustler/index.html
          grep -Fq 'Tarnowski presses UCPR over another delay at new Residence' Rustler/index.html
          grep -Fq 'Panthers split first two exhibition games' Rustler/index.html
          grep -Fq 'Catch the Ace jackpot estimated at $315,000' Rustler/index.html
          grep -Fq 'Bouquet workshop at Russell Legion today' Rustler/index.html
          grep -Fq 'Rep B rust-off sessions continue Monday' Rustler/index.html
          grep -Fq 'Busy week ahead at Town Hall' Rustler/index.html
          ! grep -Fq 'Nick Gallagher' Rustler/index.html
          grep -Fq 'photo-grid' Rustler/index.html
          grep -Fq 'site.css?v=8' Rustler/index.html
          grep -Fq 'formsubmit.co/dadabuddanews@gmail.com' Rustler/community.html
          grep -Fq 'formsubmit.co/dadabuddanews@gmail.com' Rustler/advertise.html
          grep -Fq 'Your submission has been sent to The Rustler' Rustler/thank-you.html
          for page in Rustler/*.html; do grep -Fq 'reader-actions' "$page"; done
          grep -Fq 'mayor-tarnowski-v2.jpg' Rustler/index.html
          grep -Fq 'Russell Township file photo' Rustler/index.html
          ! grep -Fq 'township-logo-v2.png' Rustler/index.html
          python3 - <<'PY'
          from pathlib import Path

          home = Path("Rustler/index.html").read_text(encoding="utf-8")

          def section(section_id: str) -> str:
              marker = f'<section id="{section_id}">'
              return home.split(marker, 1)[1].split("</section>", 1)[0]

          township = section("township")
          region = section("region")
          election = "russell-election-tarnowski-acclaimed-council-candidates-2026.html"
          west_nile = "west-nile-human-case-eastern-ontario-september-2026.html"
          tariff = "prescott-russell-tariff-relief-economic-development-2026.html"

          assert election in township and election not in region
          assert '<article class="photo-card feature-card"><figure><a href="' + election in township
          assert west_nile in region and region.index(west_nile) < region.index(tariff)
          PY
          grep -Fq 'Jonathan Bourgon' Rustler/notre-dame-road-closure-council-answers-september-2026.html
          grep -Fq 'Sébastien Dagenais' Rustler/recreation-complex-70-million-debt-financing-september-2026.html
          grep -Fq 'Jonathan Bourgon' Rustler/embrun-water-tower-delay-september-2026.html
          grep -Fq 'assets/town-hall.jpg' Rustler/embrun-water-tower-delay-september-2026.html
          ! grep -Fq 'township-logo-v2.png' Rustler/embrun-water-tower-delay-september-2026.html
          grep -Fq 'Township staff said an “important change”' Rustler/autumn-in-the-country-2000-russell-grant-2026.html
          grep -Fq 'assets/autumn-maple-leaf-water.jpg' Rustler/index.html
          grep -Fq 'assets/terry-fox.jpg' Rustler/index.html
          grep -Fq 'assets/eorn-logo.png' Rustler/index.html
          ! grep -Fq 'assets/autumn-photo-expo.jpg' Rustler/index.html
          grep -Fq 'assets/autumn-maple-leaf-water.jpg' Rustler/autumn-in-the-country-2000-russell-grant-2026.html
          ! grep -Fq 'assets/autumn-photo-expo.jpg' Rustler/autumn-in-the-country-2000-russell-grant-2026.html
          grep -Fq 'nurse-call system' Rustler/prescott-russell-residence-delay-nurse-call-september-2026.html
          grep -Fq 'assets/mayor-tarnowski-v2.jpg' Rustler/prescott-russell-residence-delay-nurse-call-september-2026.html
          grep -Fq 'Mobile story-image compaction v5' Rustler/site.css
          test -s Rustler/assets/notre-dame.jpg
          test -s Rustler/assets/rec-complex.jpg
          test -s Rustler/assets/main-street.jpg
          test -s Rustler/assets/mayor-tarnowski-v2.jpg
          test -s Rustler/assets/town-hall.jpg
          ! cmp -s Rustler/assets/mayor-tarnowski-v2.jpg Rustler/assets/town-hall.jpg
          test -s Rustler/assets/ucpr.jpg
          test -s Rustler/assets/eohu.jpg
          test -s Rustler/assets/autumn-maple-leaf-water.jpg
          test -s Rustler/assets/terry-fox.jpg
          test -s Rustler/assets/eorn-logo.png
          test -s Rustler/sitemap.xml
          grep -Fq 'community.html' Rustler/sitemap.xml
          grep -Fq 'advertise.html' Rustler/sitemap.xml
      - name: Upload Rustler site
        env:
          NEOCITIES_RUSTLER_API_KEY: ${{ secrets.NEOCITIES_RUSTLER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEOCITIES_RUSTLER_API_KEY:-}" ]] || { echo 'Missing NEOCITIES_RUSTLER_API_KEY secret' >&2; exit 1; }
          while IFS= read -r -d '' file; do
            rel="${file#Rustler/}"
            echo "Uploading $rel"
            curl --fail-with-body --show-error --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $NEOCITIES_RUSTLER_API_KEY" \
              -F "${rel}=@${file}" https://neocities.org/api/upload
          done < <(find Rustler -type f -print0 | sort -z)
      - name: Verify live edition
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          residence="$(mktemp)"
          water="$(mktemp)"
          css="$(mktemp)"
          hall="$(mktemp)"
          mayor="$(mktemp)"
          autumn="$(mktemp)"
          maple="$(mktemp)"
          terry="$(mktemp)"
          eorn="$(mktemp)"
          community="$(mktemp)"
          advertise="$(mktemp)"
          thanks="$(mktemp)"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o "$tmp" -w '%{http_code}' "https://therustler.neocities.org/?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            rcode="$(curl -L -sS -o "$residence" -w '%{http_code}' "https://therustler.neocities.org/prescott-russell-residence-delay-nurse-call-september-2026.html?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            wcode="$(curl -L -sS -o "$water" -w '%{http_code}' "https://therustler.neocities.org/embrun-water-tower-delay-september-2026.html?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            ccode="$(curl -L -sS -o "$css" -w '%{http_code}' "https://therustler.neocities.org/site.css?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            hcode="$(curl -L -sS -o "$hall" -w '%{http_code}' "https://therustler.neocities.org/assets/town-hall.jpg?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            pcode="$(curl -L -sS -o "$mayor" -w '%{http_code}' "https://therustler.neocities.org/assets/mayor-tarnowski-v2.jpg?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            acode="$(curl -L -sS -o "$autumn" -w '%{http_code}' "https://therustler.neocities.org/autumn-in-the-country-2000-russell-grant-2026.html?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            mcode="$(curl -L -sS -o "$maple" -w '%{http_code}' "https://therustler.neocities.org/assets/autumn-maple-leaf-water.jpg?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            tcode="$(curl -L -sS -o "$terry" -w '%{http_code}' "https://therustler.neocities.org/assets/terry-fox.jpg?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            ecode="$(curl -L -sS -o "$eorn" -w '%{http_code}' "https://therustler.neocities.org/assets/eorn-logo.png?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            ucode="$(curl -L -sS -o "$community" -w '%{http_code}' "https://therustler.neocities.org/community.html?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            dcode="$(curl -L -sS -o "$advertise" -w '%{http_code}' "https://therustler.neocities.org/advertise.html?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            ycode="$(curl -L -sS -o "$thanks" -w '%{http_code}' "https://therustler.neocities.org/thank-you.html?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            if [[ "$code" == "200" ]] && [[ "$rcode" == "200" ]] && [[ "$wcode" == "200" ]] && [[ "$ccode" == "200" ]] && [[ "$hcode" == "200" ]] && [[ "$pcode" == "200" ]] && [[ "$acode" == "200" ]] && [[ "$mcode" == "200" ]] && [[ "$tcode" == "200" ]] && [[ "$ecode" == "200" ]] && [[ "$ucode" == "200" ]] && [[ "$dcode" == "200" ]] && [[ "$ycode" == "200" ]] && grep -Fq 'Tarnowski presses UCPR over another delay at new Residence' "$tmp" && grep -Fq 'Panthers split first two exhibition games' "$tmp" && grep -Fq 'Catch the Ace jackpot estimated at $315,000' "$tmp" && grep -Fq 'Bouquet workshop at Russell Legion today' "$tmp" && grep -Fq 'Rep B rust-off sessions continue Monday' "$tmp" && grep -Fq 'Busy week ahead at Town Hall' "$tmp" && grep -Fq 'reader-actions' "$tmp" && ! grep -Fq 'weather-strip' "$tmp" && grep -Fq 'High / Low' "$tmp" && ! grep -Fq 'Nick Gallagher' "$tmp" && grep -Fq 'Treasurer Sébastien Dagenais' "$tmp" && grep -Fq 'infrastructure executive Jonathan Bourgon' "$tmp" && grep -Fq 'site.css?v=8' "$tmp" && grep -Fq 'assets/autumn-maple-leaf-water.jpg' "$tmp" && grep -Fq 'assets/terry-fox.jpg' "$tmp" && grep -Fq 'assets/eorn-logo.png' "$tmp" && ! grep -Fq 'assets/autumn-photo-expo.jpg' "$tmp" && grep -Fq 'Russell Township file photo' "$tmp" && ! grep -Fq 'township-logo-v2.png' "$tmp" && grep -Fq 'reader-actions' "$residence" && grep -Fq 'Tarnowski presses UCPR over another delay at new Residence' "$residence" && grep -Fq 'nurse-call system' "$residence" && grep -Fq 'assets/mayor-tarnowski-v2.jpg' "$residence" && grep -Fq 'Jonathan Bourgon' "$water" && grep -Fq 'assets/town-hall.jpg' "$water" && ! grep -Fq 'township-logo-v2.png' "$water" && grep -Fq 'assets/autumn-maple-leaf-water.jpg' "$autumn" && ! grep -Fq 'assets/autumn-photo-expo.jpg' "$autumn" && grep -Fq 'formsubmit.co/dadabuddanews@gmail.com' "$community" && grep -Fq 'Community news and events' "$community" && grep -Fq 'formsubmit.co/dadabuddanews@gmail.com' "$advertise" && grep -Fq 'Advertising inquiry' "$advertise" && grep -Fq 'Your submission has been sent to The Rustler' "$thanks" && grep -Fq 'Mobile story-image compaction v5' "$css" && grep -Fq 'Rustler visual source corrections v6' "$css" && grep -Fq 'Reader submissions and advertising actions v8' "$css" && [[ -s "$hall" ]] && [[ -s "$mayor" ]] && ! cmp -s "$hall" "$mayor" && [[ -s "$maple" ]] && [[ -s "$terry" ]] && [[ -s "$eorn" ]]; then
              echo 'Verified Sept. 6 Rustler edition, story-page action buttons, community and advertising forms, and current visuals live'
              rm -f "$tmp" "$residence" "$water" "$css" "$hall" "$mayor" "$autumn" "$maple" "$terry" "$eorn" "$community" "$advertise" "$thanks"
              exit 0
            fi
            sleep 4
          done
          echo 'Homepage verification body:'
          cat "$tmp" || true
          rm -f "$tmp" "$residence" "$water" "$css" "$hall" "$mayor" "$autumn" "$maple" "$terry" "$eorn" "$community" "$advertise" "$thanks"
          exit 1
