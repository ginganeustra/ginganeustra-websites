name: Publish The Rustler to Neocities

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Rustler/**'
      - '.rustler-upload/**'
      - '.github/scripts/fetch_rustler_visuals.py'
      - '.github/scripts/fix_rustler_attributions.py'
      - '.github/workflows/rustler-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild masthead asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Rustler/assets
          {
            cat .rustler-upload/masthead-01.b64
            cat .rustler-upload/masthead-02.b64
            cat .rustler-upload/masthead-03.b64
            head -c 16000 .rustler-upload/masthead-04.b64
            head -c 1620 .rustler-upload/masthead-05.b64
          } | base64 -d > Rustler/assets/rustler-masthead.webp
          test -s Rustler/assets/rustler-masthead.webp
      - name: Fetch official Rustler visuals
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fetch_rustler_visuals.py
          find Rustler/assets -type f -maxdepth 1 -print -exec ls -lh {} \;
      - name: Apply verified quote attributions and mobile fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_rustler_attributions.py
      - name: Validate edition
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Council puts brakes on another full Notre-Dame shutdown' Rustler/index.html
          grep -Fq 'In the TWP' Rustler/index.html
          grep -Fq 'Light rain' Rustler/index.html
          grep -Fq 'photo-grid' Rustler/index.html
          grep -Fq 'site.css?v=5' Rustler/index.html
          grep -Fq 'mayor-tarnowski-v2.jpg' Rustler/index.html
          grep -Fq 'Russell Township file photo' Rustler/index.html
          ! grep -Fq 'township-logo-v2.png' Rustler/index.html
          grep -Fq 'Jonathan Bourgon' Rustler/notre-dame-road-closure-council-answers-september-2026.html
          grep -Fq 'Sébastien Dagenais' Rustler/recreation-complex-70-million-debt-financing-september-2026.html
          grep -Fq 'Jonathan Bourgon' Rustler/embrun-water-tower-delay-september-2026.html
          grep -Fq 'assets/town-hall.jpg' Rustler/embrun-water-tower-delay-september-2026.html
          ! grep -Fq 'township-logo-v2.png' Rustler/embrun-water-tower-delay-september-2026.html
          grep -Fq 'Township staff said an “important change”' Rustler/autumn-in-the-country-2000-russell-grant-2026.html
          grep -Fq 'Mobile story-image compaction v5' Rustler/site.css
          test -s Rustler/assets/notre-dame.jpg
          test -s Rustler/assets/rec-complex.jpg
          test -s Rustler/assets/main-street.jpg
          test -s Rustler/assets/mayor-tarnowski-v2.jpg
          test -s Rustler/assets/town-hall.jpg
          test -s Rustler/assets/ucpr.jpg
          test -s Rustler/assets/eohu.jpg
          test -s Rustler/sitemap.xml
      - name: Upload Rustler site
        env:
          NEOCITIES_RUSTLER_API_KEY: ${{ secrets.NEOCITIES_RUSTLER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEOCITIES_RUSTLER_API_KEY:-}" ]] || { echo 'Missing NEOCITIES_RUSTLER_API_KEY secret' >&2; exit 1; }
          while IFS= read -r -d '' file; do
            rel="${file#Rustler/}"
            echo "Uploading $rel"
            curl --fail-with-body --show-error --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $NEOCITIES_RUSTLER_API_KEY" \
              -F "${rel}=@${file}" https://neocities.org/api/upload
          done < <(find Rustler -type f -print0 | sort -z)
      - name: Verify live edition
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          water="$(mktemp)"
          css="$(mktemp)"
          hall="$(mktemp)"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o "$tmp" -w '%{http_code}' "https://therustler.neocities.org/?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            wcode="$(curl -L -sS -o "$water" -w '%{http_code}' "https://therustler.neocities.org/embrun-water-tower-delay-september-2026.html?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            ccode="$(curl -L -sS -o "$css" -w '%{http_code}' "https://therustler.neocities.org/site.css?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            hcode="$(curl -L -sS -o "$hall" -w '%{http_code}' "https://therustler.neocities.org/assets/town-hall.jpg?verify=${GITHUB_SHA::8}-${attempt}" || true)"
            if [[ "$code" == "200" ]] && [[ "$wcode" == "200" ]] && [[ "$ccode" == "200" ]] && [[ "$hcode" == "200" ]] && grep -Fq 'Treasurer Sébastien Dagenais' "$tmp" && grep -Fq 'infrastructure executive Jonathan Bourgon' "$tmp" && grep -Fq 'site.css?v=5' "$tmp" && grep -Fq 'Russell Township file photo' "$tmp" && ! grep -Fq 'township-logo-v2.png' "$tmp" && grep -Fq 'Jonathan Bourgon' "$water" && grep -Fq 'assets/town-hall.jpg' "$water" && ! grep -Fq 'township-logo-v2.png' "$water" && grep -Fq 'Mobile story-image compaction v5' "$css" && [[ -s "$hall" ]]; then
              echo 'Verified The Rustler mobile image correction live'
              rm -f "$tmp" "$water" "$css" "$hall"
              exit 0
            fi
            sleep 4
          done
          echo 'Homepage verification body:'
          cat "$tmp" || true
          rm -f "$tmp" "$water" "$css" "$hall"
          exit 1
