name: Canada Sept. 4 morning batch fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/canada-sept4-morning-batch-fix.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Neocities deployment to settle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&per_page=20"
          for attempt in $(seq 1 90); do
            json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
            active="$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' <<<"$json")"
            echo "active Publish to Neocities runs: $active"
            [[ "$active" == 0 ]] && break
            sleep 5
          done
          json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
          [[ "$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' <<<"$json")" == 0 ]]

      - name: Reset to current main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Run the already-reviewed batch build step
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/canada-sept4-morning-batch.yml').read_text(encoding='utf-8')
          step='      - name: Build four new stories, update MAGAHEADS and front page\n'
          start=src.index(step)
          run_marker='        run: |\n'
          body_start=src.index(run_marker,start)+len(run_marker)
          end=src.index('\n      - name: Commit one publication batch to main',body_start)
          block=src[body_start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/caw-sept4-build.sh').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          bash /tmp/caw-sept4-build.sh

      - name: Commit one validated batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'canada-at-war-publisher[bot]'
          git config user.email 'canada-at-war-publisher[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No publication changes produced' >&2
            exit 1
          fi
          git commit -m 'Publish Sept. 4 Canada morning batch'
          git fetch origin main
          git rebase origin/main
          python3 scripts/validate_canada_publish.py
          python3 scripts/validate_canada_discovery.py
          git push origin HEAD:main
