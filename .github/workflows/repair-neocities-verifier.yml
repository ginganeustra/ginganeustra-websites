name: Repair Neocities verifier

on:
  push:
    paths:
      - '.github/workflows/repair-neocities-verifier.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build patched Canada publication workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          text = path.read_text(encoding='utf-8')

          old_guard = "            'THE DOOR REOPENS'"
          new_guard = "            'BESSENT ESCALATES — THEN SITS DOWN WITH CANADA'"
          if text.count(old_guard) != 1:
              raise SystemExit(f'Expected exactly one stale guard marker, found {text.count(old_guard)}')
          text = text.replace(old_guard, new_guard, 1)

          old_verify = "          check_page 'https://brazilginga.neocities.org/Canada/' 'THE DOOR REOPENS'"
          new_verify = "          check_page 'https://brazilginga.neocities.org/Canada/' 'BESSENT ESCALATES — THEN SITS DOWN WITH CANADA'"
          if text.count(old_verify) != 1:
              raise SystemExit(f'Expected exactly one stale homepage verification marker, found {text.count(old_verify)}')
          text = text.replace(old_verify, new_verify, 1)

          start_marker = "          petition_count=\"$(python3 - <<'PY'\n"
          next_marker = "          check_page 'https://brazilginga.neocities.org/Argentina/'"
          start = text.find(start_marker)
          if start < 0 or text.find(start_marker, start + 1) >= 0:
              raise SystemExit('Expected exactly one petition_count verification block start')
          next_check = text.find(next_marker, start)
          if next_check < 0:
              raise SystemExit('Could not locate first page check after petition_count block')
          block = text[start:next_check]
          if 'urllib.request' not in block or 'Petition=e-7531' not in block:
              raise SystemExit('Petition verification block changed unexpectedly; refusing broad edit')

          replacement = (
              "          petition_count=\"$(python3 - <<'PY'\n"
              "          from pathlib import Path\n"
              "          import re\n"
              "          text=Path('Canada/index.html').read_text(encoding='utf-8')\n"
              "          m=re.search(r'\\b([0-9]{1,3}(?:,[0-9]{3})+) validated signatures\\b',text)\n"
              "          if not m: raise SystemExit(1)\n"
              "          print(m.group(1))\n"
              "          PY\n"
              "          )\"\n"
          )
          text = text[:start] + replacement + text[next_check:]
          path.write_text(text, encoding='utf-8')
          PYCODE

          git diff --check
          git diff -- .github/workflows/deploy.yml
          cp .github/workflows/deploy.yml scripts/deploy-fixed.yml.txt

      - name: Publish patched workflow blob for connected GitHub commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'canada-at-war-publisher[bot]'
          git config user.email 'canada-at-war-publisher[bot]@users.noreply.github.com'
          git add scripts/deploy-fixed.yml.txt
          git commit -m 'Stage corrected Neocities workflow blob [skip ci]'
          git push origin HEAD:main
