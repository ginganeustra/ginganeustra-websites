name: Canada Sept. 5 stories final package

on:
  push:
    branches: [main]
    paths: ['.github/workflows/canada-sept5-stories-finalize.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for older Neocities deploys
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&per_page=30"
          for attempt in $(seq 1 120); do
            json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
            active="$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' <<<"$json")"
            echo "active normal deploys: $active"
            [[ "$active" == 0 ]] && break
            sleep 5
          done
          json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
          [[ "$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' <<<"$json")" == 0 ]]

      - name: Patch complete Canada homepage, MAGAHEADS and discovery
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import re

          C=Path('Canada'); H=C/'index.html'
          trade='trump-end-canada-trade-us-cost-september-5-2026.html'
          maga='magaheads-trump-no-trade-canada-september-5-2026.html'
          quiet='washington-talks-ottawa-stops-answering-september-5-2026.html'
          doj='doj-canada-pause-misunderstanding-trump-fed-september-4-2026.html'
          oldtrade='trump-fed-trade-deficit-threat-september-4-2026.html'
          oldmaga='magaheads-washington-canada-message-september-2-2026.html'
          fallback='assets/canada-at-war-goose-eagle-v3.jpg'

          for slug in [trade,maga,quiet,doj,oldtrade]:
              if not (C/slug).exists(): raise SystemExit(f'Missing required article: {slug}')
          if not (C/fallback).exists(): raise SystemExit(f'Missing fallback art: {fallback}')

          now=datetime.now(ZoneInfo('America/Toronto'))
          band=now.strftime('UPDATED · %B %-d, %Y · %-I:%M %p ET').upper().replace(' AM ET',' A.M. ET').replace(' PM ET',' P.M. ET')
          updated=now.strftime('Sept. 5, 2026 · %-I:%M %p ET').replace('AM','a.m.').replace('PM','p.m.')

          # Update MAGAHEADS with Glenn Beck's Sept. 4 Canada segment.
          mp=C/maga
          m=mp.read_text(encoding='utf-8')
          if 'Glenn Beck turns the dispute into a mock Canadian-threat briefing' not in m:
              beck='''\n<h2>Glenn Beck turns the dispute into a mock Canadian-threat briefing</h2>\n<p>Friday’s echo-chamber contribution came from Glenn Beck. His site posted a Sept. 4 segment under the title <em>Canada Has Completely Lost It</em>. On his radio program, Beck ridiculed Canadian concern about the flood of memes and reports discussing military contingency planning, mocked Mark Carney, then turned the dispute into a comic “Know Your Canadian” preparedness guide.</p>\n<p>The routine treated Canadians as a mock security problem for Americans to identify and manage. It joked about Celsius, kilometres, double-doubles, loonies and ketchup chips; told listeners to “secure the children” and leave a route north open; and folded tariffs, sovereignty and 51st-state talk into the premise of an agitated Canadian encounter.</p>\n<p>Later in the program, an Ontario caller told Beck he had found the routine hilarious. Beck kept the bit going by joking that the caller should not bring other Canadians across the border.</p>\n<p class="analysis"><strong>Analysis:</strong> Beck is not an administration official and the segment is comedy, not policy. Its relevance is cultural: the same bilateral dispute being argued by Trump, Lutnick, Bessent and Greer is also being recast for a conservative media audience as entertainment in which Canadian alarm and Canadian sovereignty concerns become objects of ridicule. There is no evidence that Beck’s routine was coordinated with the administration.</p>\n'''
              anchor='<h2>No matching Canadian response to the embargo language yet</h2>'
              if anchor not in m: raise SystemExit('MAGAHEADS Beck insertion anchor missing')
              m=m.replace(anchor,beck+anchor,1)
              src_anchor='</div>\n</main>'
              add='''<a href="https://www.glennbeck.com/watch">Glenn Beck — “Canada Has Completely Lost It,” Sept. 4</a><br>\n<a href="https://podscripts.co/podcasts/the-glenn-beck-program/lindsay-clancy-trial-gets-a-shocking-twist-guests-max-lucado-stanley-woodward-jr-9426">The Glenn Beck Program — Sept. 4 program transcript</a><br>\n'''
              if src_anchor not in m: raise SystemExit('MAGAHEADS sources anchor missing')
              m=m.replace(src_anchor,add+src_anchor,1)
          m=re.sub(r'<div class="top">(?:PUBLISHED|UPDATED) · .*?</div>',f'<div class="top">{band}</div>',m,count=1,flags=re.S)
          m=re.sub(r'<p class="meta">Published Sept\. 5, 2026 · 8:25 a\.m\. ET(?: · Updated .*?)?</p>',f'<p class="meta">Published Sept. 5, 2026 · 8:25 a.m. ET · Updated {updated}</p>',m,count=1)
          m=m.replace('Jamieson Greer kept Canada in the public argument in a fresh interview.','Jamieson Greer kept Canada in the public argument in a fresh interview, while Glenn Beck turned the dispute into a mock Canadian-threat preparedness routine.',1)
          mp.write_text(m,encoding='utf-8')

          # The staged Sept. 5 lead art is malformed. Use a known-good existing raster and truthfully relabel it.
          tp=C/trade
          t=tp.read_text(encoding='utf-8')
          t=t.replace('assets/us-hand-crushing-canada-editorial-september-5-2026.jpg',fallback)
          t=re.sub(r'alt="AI-generated editorial illustration of a giant American hand pressing down on a fractured map of Canada"', 'alt="Editorial illustration of a Canadian goose and an American eagle"', t)
          t=re.sub(r'<figcaption>AI-generated editorial illustration supplied by the editor\.</figcaption>', '<figcaption>Editorial illustration of a Canadian goose and an American eagle.</figcaption>', t, count=1)
          tp.write_text(t,encoding='utf-8')

          qp=C/quiet
          q=qp.read_text(encoding='utf-8')
          q=q.replace('assets/george-washington-exhausted-editorial-september-5-2026.jpg',fallback)
          q=re.sub(r'alt="AI-generated editorial illustration of George Washington looking exhausted"', 'alt="Editorial illustration of a Canadian goose and an American eagle"', q)
          q=re.sub(r'<figcaption>AI-generated editorial illustration supplied by the editor\.</figcaption>', '<figcaption>Editorial illustration of a Canadian goose and an American eagle.</figcaption>', q, count=1)
          qp.write_text(q,encoding='utf-8')

          h=H.read_text(encoding='utf-8')
          protected=['CANADA_AT_WAR_MASTHEAD_LOCK','PINNED_LEAD_LOCK','THE TICK','tradingview-widget-container','canada-at-war-goose-eagle-v3.jpg','petition-paint-mix','How Lying Works','id="must-read-library"']
          missing=[x for x in protected if x not in h]
          if missing: raise SystemExit(f'Protected markers missing before edit: {missing}')
          before=h.count('<article class="story')

          display=now.strftime('Published Sept. 5, 2026 · %-I:%M %p ET').replace('AM','a.m.').replace('PM','p.m.')
          hero=f'''<!-- CANADA_LEAD_BEGIN -->\n<section class="hero"><div class="hero-in"><div class="k">Analysis · Canada–U.S. trade · United States economy</div><h1>TRUMP SAYS AMERICA COULD STOP TRADING WITH CANADA. HERE’S WHAT AMERICA WOULD LOSE.</h1><img src="{fallback}" alt="Editorial illustration of a Canadian goose and an American eagle" style="display:block;width:100%;max-width:900px;height:auto;margin:18px auto 26px"><p>No major study models the literal zero-trade threat Trump described Friday. Research on much smaller disruptions already shows the United States would damage its own factories, energy system, farms, exporters and household incomes.</p><a class="read" href="{trade}">Read the analysis →</a><p class="meta">{display}</p></div></section>\n<!-- CANADA_LEAD_END -->'''
          h,n=re.subn(r'<!-- CANADA_LEAD_BEGIN -->.*?<!-- CANADA_LEAD_END -->',hero,h,count=1,flags=re.S)
          if n!=1:
              legacy=re.search(r'<!-- PINNED_LEAD_LOCK -->\s*(<section class="hero">.*?</section>)\s*<main class="wrap">',h,re.S)
              if not legacy: raise SystemExit('Lead block replacement failed')
              h=h[:legacy.start(1)]+hero+h[legacy.end(1):]

          def rm(text,href):
              return re.sub(r'<article\b[^>]*>(?:(?!</article>).)*?href="'+re.escape(href)+r'"(?:(?!</article>).)*?</article>\s*','',text,flags=re.S)
          for href in [trade,maga,quiet,doj,oldtrade,oldmaga]:
              h=rm(h,href)

          cards=f'''<article class="story story-feature"><div><div class="k" style="color:#b51f2a">MAGAHEADS · September 5 · Daily briefing</div><h2>MAGAHEADS: TRUMP MOVES FROM TARIFFS TO TALK OF ENDING TRADE WITH CANADA</h2><p>Trump escalated to explicit talk of ending trade with Canada, Greer carried the administration’s case into Saturday, and Glenn Beck turned the dispute into a mock “Know Your Canadian” threat-preparedness routine.</p><a class="read" href="{maga}">Read MAGAHEADS →</a></div><img src="assets/magaheads-white-house-hands-september-2-2026.svg" alt="MAGAHEADS editorial illustration"></article>\n<article class="story story-feature"><div><div class="k" style="color:#b51f2a">Analysis · Canada–U.S. relations · Public messaging</div><h2>WASHINGTON CAN’T STOP TALKING ABOUT CANADA. OTTAWA HAS STOPPED ANSWERING EVERY VOLLEY.</h2><p>Trump and his economic officials have kept Canada in an almost daily public argument. Ottawa is still acting, but it has not matched Washington’s public cadence since Carney answered Thursday.</p><a class="read" href="{quiet}">Read the analysis →</a></div><img src="{fallback}" alt="Editorial illustration of a Canadian goose and an American eagle"></article>\n<article class="story story-feature"><div><div class="k" style="color:#b51f2a">United States · Justice Department · Canada–U.S. relations</div><h2>DOJ CALLS ‘PAUSE ON CANADA’ A MISUNDERSTANDING — AS WASHINGTON LURCHES THROUGH A DAY OF ERRATIC POLICY</h2><p>A written antitrust instruction told staff to stop cooperation with Canada. The department says it only meant to delay a meeting.</p><a class="read" href="{doj}">Read the report →</a></div><img src="assets/lady-justice-canada-antitrust-sept4-2026.jpg" alt="AI-generated editorial illustration of a distressed Lady Justice"></article>'''
          if '<main class="wrap">' not in h: raise SystemExit('Main feed anchor missing')
          h=h.replace('<main class="wrap">','<main class="wrap">\n'+cards,1)
          h=re.sub(r'<div class="top">UPDATED · .*?</div>',f'<div class="top">{band}</div>',h,count=1,flags=re.S)
          h=re.sub(r'<title>Canada at War — .*?</title>',f'<title>Canada at War — {now.strftime("%B")} {now.day}, {now.year}</title>',h,count=1,flags=re.S)

          missing=[x for x in protected if x not in h]
          if missing: raise SystemExit(f'Protected markers missing after edit: {missing}')
          for href in [trade,maga,quiet,doj]:
              if h.count(f'href="{href}"')!=1: raise SystemExit(f'Homepage link count failed for {href}')
          if f'href="{oldtrade}"' in h: raise SystemExit('Superseded Trump card still on homepage')
          if f'href="{oldmaga}"' in h: raise SystemExit('Superseded MAGAHEADS card still on homepage')
          if h.count('<article class="story') < before-2: raise SystemExit('Unexpected story-card loss')
          H.write_text(h,encoding='utf-8')
          PY

          python3 scripts/sync_canada_discovery.py trump-end-canada-trade-us-cost-september-5-2026.html magaheads-trump-no-trade-canada-september-5-2026.html washington-talks-ottawa-stops-answering-september-5-2026.html trump-fed-trade-deficit-threat-september-4-2026.html
          python3 scripts/validate_canada_publish.py
          python3 scripts/validate_canada_discovery.py
          grep -Fq 'Glenn Beck turns the dispute into a mock Canadian-threat briefing' Canada/magaheads-trump-no-trade-canada-september-5-2026.html

      - name: Commit final source state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'canada-at-war-finalizer[bot]'
          git config user.email 'canada-at-war-finalizer[bot]@users.noreply.github.com'
          git add Canada/index.html Canada/magaheads-trump-no-trade-canada-september-5-2026.html Canada/trump-end-canada-trade-us-cost-september-5-2026.html Canada/washington-talks-ottawa-stops-answering-september-5-2026.html Canada/archive.html Canada/sitemap.xml sitemap.xml news-sitemap.xml
          if git diff --cached --quiet; then
            echo 'No source delta to commit'
            echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'Canada: publish Sept. 5 package and add Glenn Beck to MAGAHEADS'
          local_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "FINAL_SHA=${local_sha}" >> "$GITHUB_ENV"

      - name: Wait for normal deploys after final commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&per_page=30"
          for attempt in $(seq 1 120); do
            json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
            active="$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' <<<"$json")"
            echo "active normal deploys: $active"
            [[ "$active" == 0 ]] && break
            sleep 5
          done

      - name: Direct upload final Canada package
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NEOCITIES_API_KEY:-}" ]]
          files=(
            Canada/index.html
            Canada/trump-end-canada-trade-us-cost-september-5-2026.html
            Canada/magaheads-trump-no-trade-canada-september-5-2026.html
            Canada/washington-talks-ottawa-stops-answering-september-5-2026.html
            Canada/trump-fed-trade-deficit-threat-september-4-2026.html
            Canada/doj-canada-pause-misunderstanding-trump-fed-september-4-2026.html
            Canada/assets/canada-at-war-goose-eagle-v3.jpg
            Canada/assets/magaheads-white-house-hands-september-2-2026.svg
            Canada/assets/lady-justice-canada-antitrust-sept4-2026.jpg
            Canada/archive.html
            Canada/sitemap.xml
            sitemap.xml
            news-sitemap.xml
          )
          for file in "${files[@]}"; do
            test -s "$file"
            curl --fail-with-body --show-error --retry 3 --retry-all-errors -H "Authorization: Bearer $NEOCITIES_API_KEY" -F "${file}=@${file}" https://neocities.org/api/upload
          done

      - name: Final public verification
        shell: bash
        run: |
          set -euo pipefail
          short="${FINAL_SHA::8}"
          check(){ u="$1"; m="$2"; f="$(mktemp)"; ok=0; for i in 1 2 3 4 5 6 7 8; do c="$(curl -L -sS -o "$f" -w '%{http_code}' "${u}?v=${short}&verify=${i}" || true)"; [[ "$c" == 200 ]] && grep -Fq "$m" "$f" && { ok=1; break; }; sleep 3; done; echo "verify $u http=$c marker=$m"; rm -f "$f"; [[ "$ok" == 1 ]]; }
          check 'https://brazilginga.neocities.org/Canada/' 'TRUMP SAYS AMERICA COULD STOP TRADING WITH CANADA. HERE’S WHAT AMERICA WOULD LOSE.'
          check 'https://brazilginga.neocities.org/Canada/' 'Glenn Beck turned the dispute into a mock'
          check 'https://brazilginga.neocities.org/Canada/trump-end-canada-trade-us-cost-september-5-2026.html' 'TRUMP SAYS AMERICA COULD STOP TRADING WITH CANADA. HERE’S WHAT AMERICA WOULD LOSE.'
          check 'https://brazilginga.neocities.org/Canada/magaheads-trump-no-trade-canada-september-5-2026.html' 'Glenn Beck turns the dispute into a mock Canadian-threat briefing'
          check 'https://brazilginga.neocities.org/Canada/magaheads-trump-no-trade-canada-september-5-2026.html' 'Canada Has Completely Lost It'
          check 'https://brazilginga.neocities.org/Canada/washington-talks-ottawa-stops-answering-september-5-2026.html' 'WASHINGTON CAN’T STOP TALKING ABOUT CANADA. OTTAWA HAS STOPPED ANSWERING EVERY VOLLEY.'
          check 'https://brazilginga.neocities.org/Canada/doj-canada-pause-misunderstanding-trump-fed-september-4-2026.html' 'DOJ CALLS ‘PAUSE ON CANADA’ A MISUNDERSTANDING'
          check 'https://brazilginga.neocities.org/Canada/archive.html' 'MAGAHEADS: TRUMP MOVES FROM TARIFFS TO TALK OF ENDING TRADE WITH CANADA'
          check 'https://brazilginga.neocities.org/Canada/archive.html' 'TRUMP NOW NAMES CANADA IN THREAT TO END TRADE AS HE PRESSURES FED'
          for url in \
            'https://brazilginga.neocities.org/Canada/assets/canada-at-war-goose-eagle-v3.jpg' \
            'https://brazilginga.neocities.org/Canada/assets/magaheads-white-house-hands-september-2-2026.svg' \
            'https://brazilginga.neocities.org/Canada/assets/lady-justice-canada-antitrust-sept4-2026.jpg'; do
            code="$(curl -L -sS -o /tmp/art -w '%{http_code}' "${url}?v=${short}")"
            size="$(wc -c </tmp/art)"
            echo "verify art $url http=$code bytes=$size"
            [[ "$code" == 200 && "$size" -gt 5000 ]]
          done
          check 'https://brazilginga.neocities.org/Canada/sitemap.xml' 'magaheads-trump-no-trade-canada-september-5-2026.html'
          check 'https://brazilginga.neocities.org/sitemap.xml' 'magaheads-trump-no-trade-canada-september-5-2026.html'
          check 'https://brazilginga.neocities.org/news-sitemap.xml' 'magaheads-trump-no-trade-canada-september-5-2026.html'
          echo "FINAL VERIFIED SHA=${FINAL_SHA}"
