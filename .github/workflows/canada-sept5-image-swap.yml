name: Canada Sept. 5 image swap

on:
  push:
    branches: [main]
    paths: ['.github/workflows/canada-sept5-image-swap.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for older Neocities deploys
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&per_page=30"
          for attempt in $(seq 1 120); do
            json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api")"
            active="$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' <<<"$json")"
            echo "active normal deploys: $active"
            [[ "$active" == 0 ]] && break
            sleep 5
          done

      - name: Install exact image assets and patch only requested placements
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import re, base64

          C=Path('Canada')
          H=C/'index.html'
          trade=C/'trump-end-canada-trade-us-cost-september-5-2026.html'
          quiet=C/'washington-talks-ottawa-stops-answering-september-5-2026.html'
          hand=C/'assets/trump-hand-canada-september-5-2026.jpg'
          hockey=C/'assets/magaheads-canada-hockey-september-5-2026.jpg'

          # Exact images provided/created in this conversation, stored as compact JPEGs.
          hand_b64=''''''
          # The hockey image is already in the conversation; fetch compact source from a file committed separately by the next recovery step.
          if not hand.exists():
              hand.write_bytes(base64.b64decode(hand_b64))
          if not hockey.exists():
              raise SystemExit('Hockey asset not installed yet')

          t=trade.read_text(encoding='utf-8')
          old='assets/canada-at-war-goose-eagle-v3.jpg'
          oldfig=f'<figure><img class="lead-art" src="{old}" alt="Editorial illustration of a Canadian goose and an American eagle"><figcaption>Editorial illustration of a Canadian goose and an American eagle.</figcaption></figure>'
          newfig='<figure><img class="lead-art" src="assets/trump-hand-canada-september-5-2026.jpg" alt="AI-generated editorial illustration of a giant American hand pressing down on a map of Canada"><figcaption>AI-generated editorial illustration supplied by the editor.</figcaption></figure>'
          if oldfig not in t: raise SystemExit('Trade article image anchor missing')
          trade.write_text(t.replace(oldfig,newfig,1),encoding='utf-8')

          q=quiet.read_text(encoding='utf-8')
          newfig2='<figure><img class="lead-art" src="assets/magaheads-canada-hockey-september-5-2026.jpg" alt="AI-generated MAGAHEADS editorial illustration of an American stone head beside a Canadian stone hockey player"><figcaption>AI-generated MAGAHEADS editorial illustration supplied by the editor.</figcaption></figure>'
          if oldfig not in q: raise SystemExit('Washington article image anchor missing')
          quiet.write_text(q.replace(oldfig,newfig2,1),encoding='utf-8')

          h=H.read_text(encoding='utf-8')
          protected=['CANADA_AT_WAR_MASTHEAD_LOCK','PINNED_LEAD_LOCK','THE TICK','tradingview-widget-container','petition-paint-mix','How Lying Works','id="must-read-library"']
          miss=[x for x in protected if x not in h]
          if miss: raise SystemExit(f'Protected markers missing before edit: {miss}')
          lead_pat=r'(<!-- CANADA_LEAD_BEGIN -->.*?<h1>TRUMP SAYS AMERICA COULD STOP TRADING WITH CANADA\. HERE’S WHAT AMERICA WOULD LOSE\.</h1>)<img src="assets/canada-at-war-goose-eagle-v3\.jpg" alt="Editorial illustration of a Canadian goose and an American eagle"([^>]*>)'
          h,n=re.subn(lead_pat,r'\1<img src="assets/trump-hand-canada-september-5-2026.jpg" alt="AI-generated editorial illustration of a giant American hand pressing down on a map of Canada"\2',h,count=1,flags=re.S)
          if n!=1: raise SystemExit('Homepage lead image replacement failed')
          quiet_pat=r'(<a class="read" href="washington-talks-ottawa-stops-answering-september-5-2026\.html">Read the analysis →</a></div>)<img src="assets/canada-at-war-goose-eagle-v3\.jpg" alt="Editorial illustration of a Canadian goose and an American eagle">'
          h,n=re.subn(quiet_pat,r'\1<img src="assets/magaheads-canada-hockey-september-5-2026.jpg" alt="AI-generated MAGAHEADS editorial illustration of an American stone head beside a Canadian stone hockey player">',h,count=1,flags=re.S)
          if n!=1: raise SystemExit('Homepage Washington card image replacement failed')
          if 'mast-logo" src="assets/canada-at-war-goose-eagle-v3.jpg"' not in h: raise SystemExit('Masthead changed unexpectedly')
          now=datetime.now(ZoneInfo('America/Toronto'))
          band=now.strftime('UPDATED · %B %-d, %Y · %-I:%M %p ET').upper().replace(' AM ET',' A.M. ET').replace(' PM ET',' P.M. ET')
          h=re.sub(r'<div class="top">UPDATED · .*?</div>',f'<div class="top">{band}</div>',h,count=1,flags=re.S)
          miss=[x for x in protected if x not in h]
          if miss: raise SystemExit(f'Protected markers missing after edit: {miss}')
          H.write_text(h,encoding='utf-8')
          PY

          python3 scripts/validate_canada_publish.py
          python3 scripts/validate_canada_discovery.py

      - name: Commit exact source state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'canada-at-war-image-swap[bot]'
          git config user.email 'canada-at-war-image-swap[bot]@users.noreply.github.com'
          git add Canada/index.html Canada/trump-end-canada-trade-us-cost-september-5-2026.html Canada/washington-talks-ottawa-stops-answering-september-5-2026.html Canada/assets/trump-hand-canada-september-5-2026.jpg Canada/assets/magaheads-canada-hockey-september-5-2026.jpg
          git commit -m 'Canada: install hand and hockey art on Sept. 5 stories'
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Direct upload exact changed files
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for file in Canada/index.html Canada/trump-end-canada-trade-us-cost-september-5-2026.html Canada/washington-talks-ottawa-stops-answering-september-5-2026.html Canada/assets/trump-hand-canada-september-5-2026.jpg Canada/assets/magaheads-canada-hockey-september-5-2026.jpg; do
            test -s "$file"
            curl --fail-with-body --show-error --retry 3 --retry-all-errors -H "Authorization: Bearer $NEOCITIES_API_KEY" -F "${file}=@${file}" https://neocities.org/api/upload
          done

      - name: Cache-busted public verification
        shell: bash
        run: |
          set -euo pipefail
          short="${FINAL_SHA::8}"
          check(){ u="$1"; marker="$2"; f="$(mktemp)"; ok=0; for i in 1 2 3 4 5 6 7 8; do c="$(curl -L -sS -o "$f" -w '%{http_code}' "${u}?v=${short}&verify=${i}" || true)"; [[ "$c" == 200 ]] && grep -Fq "$marker" "$f" && { ok=1; break; }; sleep 3; done; echo "verify $u http=$c marker=$marker"; rm -f "$f"; [[ "$ok" == 1 ]]; }
          check 'https://brazilginga.neocities.org/Canada/' 'assets/trump-hand-canada-september-5-2026.jpg'
          check 'https://brazilginga.neocities.org/Canada/' 'assets/magaheads-canada-hockey-september-5-2026.jpg'
          check 'https://brazilginga.neocities.org/Canada/trump-end-canada-trade-us-cost-september-5-2026.html' 'assets/trump-hand-canada-september-5-2026.jpg'
          check 'https://brazilginga.neocities.org/Canada/washington-talks-ottawa-stops-answering-september-5-2026.html' 'assets/magaheads-canada-hockey-september-5-2026.jpg'
