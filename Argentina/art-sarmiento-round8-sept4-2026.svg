<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Sarmiento win 2–0 as Clausura Round 8 gets underway</title><desc id="d">Original La Nuestra editorial illustration using a standings-arrow and football-pitch motif. No third-party imagery or club marks.</desc><rect width="1600" height="900" fill="#081018"/><rect x="970" width="630" height="900" fill="#17375f"/><g opacity=".35" fill="#3b79a0"><path d="M960 0h170l400 900h-170z"/><path d="M1320 0h160l120 270v400z"/></g><text x="70" y="120" fill="#81c7e9" font-family="Georgia,serif" font-size="76" font-weight="700">La Nuestra</text><rect x="70" y="145" width="230" height="10" fill="#81c7e9"/><text x="70" y="220" fill="#dce3eb" font-family="Arial,sans-serif" font-size="30" font-weight="700">CLAUSURA · ROUND 8</text><text x="70" y="325" fill="#fff" font-family="Arial,sans-serif" font-size="72" font-weight="900"><tspan x="70">Sarmiento win 2–0</tspan><tspan x="70" dy="86">as Round 8 gets</tspan><tspan x="70" dy="86">underway</tspan></text><text x="70" y="645" fill="#c7d2df" font-family="Arial,sans-serif" font-size="34"><tspan x="70">The Junín side move to 15 points in Zone B after</tspan><tspan x="70" dy="48">victory at Estudiantes de Río Cuarto.</tspan></text><rect x="1090" y="92" width="410" height="64" rx="20" fill="#81c7e9"/><text x="1118" y="133" fill="#10294b" font-family="Arial,sans-serif" font-size="24" font-weight="800">ORIGINAL EDITORIAL ART</text><rect x="1070" y="175" width="480" height="590" rx="24" fill="none" stroke="#eef2f4" stroke-width="5"/><g fill="#81c7e9"><rect x="1120" y="610" width="50" height="90"/><rect x="1200" y="560" width="50" height="140"/><rect x="1280" y="500" width="50" height="200"/><rect x="1360" y="430" width="50" height="270"/></g><path d="M1145 620L1230 545L1305 485L1425 350" stroke="#fff" stroke-width="28" fill="none"/><path d="M1390 340h75v75z" fill="#fff"/></svg>